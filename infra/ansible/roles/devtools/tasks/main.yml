---
- name: Enable Ghostty COPR
  community.general.copr:
    name: scottames/ghostty
    state: enabled
  register: freidora_devtools_copr

- name: Import Microsoft signing key
  ansible.builtin.rpm_key:
    key: https://packages.microsoft.com/keys/microsoft.asc
    state: present
  register: freidora_devtools_key

- name: Deploy VS Code repository from config/system (gpgcheck=1)
  ansible.builtin.copy:
    src: "{{ freidora_config_dir }}/system/vscode.repo"
    dest: /etc/yum.repos.d/vscode.repo
    owner: root
    group: root
    mode: "0644"
  register: freidora_devtools_repo

# In check mode the repositories above are not really added, so their
# packages cannot be queried or installed yet.
- name: Note repositories pending in check mode
  ansible.builtin.set_fact:
    freidora_devtools_repos_pending: >-
      {{ ansible_check_mode and (freidora_devtools_copr is changed
         or freidora_devtools_key is changed
         or freidora_devtools_repo is changed) }}

- name: Warn that package checks are skipped
  ansible.builtin.debug:
    msg: "Check mode: Ghostty and VS Code repositories are not configured yet; package checks skipped."
  when: freidora_devtools_repos_pending

- name: Check packages exist for this architecture
  ansible.builtin.command:
    cmd: dnf -q repoquery --arch {{ ansible_facts['architecture'] }},noarch --latest-limit 1 {{ item }}
  loop: "{{ freidora_devtools_packages }}"
  register: freidora_devtools_query
  changed_when: false
  check_mode: false
  when: not freidora_devtools_repos_pending

- name: Fail clearly on missing packages
  ansible.builtin.fail:
    msg: "Package '{{ item.item }}' is not available for {{ ansible_facts['architecture'] }}."
  loop: "{{ freidora_devtools_query.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not freidora_devtools_repos_pending
    - item.stdout | trim | length == 0

- name: Install Ghostty and VS Code Insiders
  ansible.builtin.dnf:
    name: "{{ freidora_devtools_packages }}"
    state: present
  when: not freidora_devtools_repos_pending

- name: Create Ghostty config directory
  ansible.builtin.file:
    path: "{{ freidora_home }}/.config/ghostty"
    state: directory
    owner: "{{ freidora_user }}"
    group: "{{ freidora_user }}"
    mode: "0755"

- name: Deploy Ghostty config from config/
  ansible.builtin.copy:
    src: "{{ freidora_config_dir }}/dotfiles/.config/ghostty/config"
    dest: "{{ freidora_home }}/.config/ghostty/config"
    owner: "{{ freidora_user }}"
    group: "{{ freidora_user }}"
    mode: "0644"

- name: Check whether VS Code Insiders is installed
  ansible.builtin.stat:
    path: /usr/bin/code-insiders
  register: freidora_vscode_bin

- name: List VS Code Insiders extensions
  ansible.builtin.command: code-insiders --list-extensions
  register: freidora_vscode_installed
  changed_when: false
  check_mode: false
  when: freidora_vscode_bin.stat.exists
  become: true
  become_user: "{{ freidora_user }}"

- name: Install VS Code Insiders extensions
  ansible.builtin.command: code-insiders --install-extension {{ item }}
  loop: "{{ freidora_vscode_extensions }}"
  when: item | lower not in (freidora_vscode_installed.stdout | default('') | lower).splitlines()
  become: true
  become_user: "{{ freidora_user }}"

- name: Install Claude Code (native installer)
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
    creates: "{{ freidora_home }}/.local/bin/claude"
    executable: /bin/bash
  become: true
  become_user: "{{ freidora_user }}"
