---
- name: Harden sshd (keys only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-freidora.conf
    mode: "0600"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Enable sshd
  ansible.builtin.systemd_service:
    name: sshd
    enabled: true
    state: started
